name: 构建可执行文件

# 推送到 main 时自动构建 Linux 版；打 tag 时构建并发布 Linux 与 Windows 版
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk espeak-ng \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 生成测试素材
        run: python tests/make_assets.py

      - name: 运行测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          pytest tests/ -v --junitxml=test-results.xml
          rc=$?
          set -e
          # 判定以 JUnit 报告为准：PySide6 在 offscreen 下的 QObject 析构问题会让
          # pytest 在打印完报告后、解释器退出阶段段错误(退出码 139)，那不是用例失败。
          if [ ! -f test-results.xml ]; then echo '未生成测试报告，视为失败'; exit 1; fi
          if grep -qE 'failures="[1-9]' test-results.xml || grep -qE 'errors="[1-9]' test-results.xml; then
            echo '存在失败或出错的测试用例'; exit 1
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 139 ]; then echo "pytest 异常退出: $rc"; exit $rc; fi
          grep -oE '<testsuite [^>]*>' test-results.xml | head -n 1
          echo "pytest exit code: $rc"

  build-linux:
    name: 构建 Linux 版
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 打包
        working-directory: packaging
        run: pyinstaller --clean --noconfirm linguatrans.spec

      - name: 压缩产物
        run: |
          cd packaging/dist
          tar czf linguatrans-linux-x64.tar.gz linguatrans

      - uses: actions/upload-artifact@v4
        with:
          name: linguatrans-linux-x64
          path: packaging/dist/linguatrans-linux-x64.tar.gz

  build-windows:
    name: 构建 Windows 版
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 打包
        working-directory: packaging
        run: pyinstaller --clean --noconfirm linguatrans.spec

      - name: 压缩产物
        run: |
          cd packaging/dist
          Compress-Archive -Path linguatrans -DestinationPath linguatrans-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: linguatrans-windows-x64
          path: packaging/dist/linguatrans-windows-x64.zip

  release:
    name: 发布
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linguatrans-linux-x64/linguatrans-linux-x64.tar.gz
            artifacts/linguatrans-windows-x64/linguatrans-windows-x64.zip
          generate_release_notes: true
